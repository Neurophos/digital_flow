# Specs for POC MSIC SoC
# NOTE: For new entries to be used in prepro, they must also be added to read_sysinfo.py
msic:
  metasurface:
    x_pixel_cnt: 64
    y_pixel_cnt: 64
    x_pixel_frames: 8
    y_pixel_frames: 8
    pixel_frame_cols: 8
    pixel_frame_rows: 8
  dac_ctrl:
    num_dac_ram_macros: 8
    dac_ram_macro_width: 32
    dac_pixelframe_cnt: 64
  memory_map:
    apb_base: 0x40000000
    arm_rom_base: 0x00000000
    arm_ram_base: 0x20000000
    dac_sram_base: 0x30000000
    cs_rom_table_base: 0xF0000000
    # Modules mapped within the APB area.  Each are 4K in size
    apb_modules:
        timer0_base: 0x0000
        timer1_base: 0x1000
        dualtimer_base: 0x2000
        uart0_base: 0x3000
        uart1_base: 0x4000
        uart2_base: 0x5000
        watchdog_base: 0x6000
        test_slave_base: 0x7000
        spi_host_base: 0x8000
        fabio_tgt_base: 0x9000
        gpio_base: 0xA000
        chip_ctrl_base: 0xB000
        clock_ctrl_base: 0xC000
        dac_ctrl_base: 0xd000
